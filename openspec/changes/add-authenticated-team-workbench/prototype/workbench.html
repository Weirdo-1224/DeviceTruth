  function newView(){return titleBlock('新建调查','调查工作台')+`<main class="p-main">${readonly()}<form id="p-new-form" class="p-empty-form"><h2>从设备现象开始</h2><p class="p-help">归属：${esc(spaceName())} · ${isTeam()?'团队成员可见':'仅自己可见'}</p><label class="p-field">调查标题<input name="title" required placeholder="例如：车载座舱空调不转" ${canEdit()?'':'disabled'}></label><label class="p-field">问题描述<textarea name="symptom" required rows="4" placeholder="描述异常现象、出现条件，以及已经做过的检查…" ${canEdit()?'':'disabled'}></textarea></label><label class="p-field">排查设备（可选）<select name="asset" ${canEdit()?'':'disabled'}><option value="">暂不指定设备</option>${assetOptions()}</select></label><div class="p-row"><button class="p-btn p-primary" type="submit" ${canEdit()?'':'disabled'}>创建并开始调查</button>${link('返回调查','back-case')}</div><p class="p-footnote">演示中只创建当前页面的记录，刷新后不保留。</p></form></main>`;}

  function devicesView(){return titleBlock('设备档案','设备档案')+`<main class="p-main"><p class="p-help">设备按当前空间组织；选择档案不代表现场配置已经核实。</p><div class="p-page-card">${state.space==='team'?`<div class="p-source-row"><div><strong>EV-DEMO-016</strong><p>车载设备 · SIMULATED 演示数据</p><p>现场配置：待核实</p></div>${btn('查看相关调查','related-case','p-compact')}</div>`:'<div class="p-empty"><h3>当前空间还没有设备档案</h3><p>不影响开始调查，新调查可以暂不指定设备。</p></div>'}</div></main>`;}
  function membersView(){return titleBlock(state.space==='team'?state.teamName:spaceName(),'团队成员',tag(roleNames[state.role]))+`<main class="p-main"><div class="p-section-head"><h3>团队成员</h3><span class="p-small p-muted">${members().length} 位成员</span></div><div class="p-page-card"><table class="p-table"><thead><tr><th style="width:36%">成员</th><th style="width:34%">邮箱</th><th style="width:30%">角色</th></tr></thead><tbody>${members().map(m=>`<tr><td><div class="p-member-name">${avatar(m.name,m.self)}<span>${esc(m.name)}${m.self?'（你）':''}</span></div></td><td class="p-muted">${esc(m.email)}</td><td>${canAdmin()&&!m.self?`<select aria-label="${esc(m.name)}的角色" data-member-role="${m.id}">${Object.entries(roleNames).map(([v,n])=>`<option value="${v}" ${m.role===v?'selected':''}>${n}</option>`).join('')}</select>`:tag(m.self?roleNames[state.role]:roleNames[m.role])}</td></tr>`).join('')}</tbody></table></div><p class="p-help">管理员管理成员与团队设置；协作成员可共同推进调查；只读成员可查看调查、资料与报告。</p>${canAdmin()?`<section class="p-section p-page-card"><h3>邀请成员</h3><p class="p-help">通过邮箱指定受邀人及加入角色。</p><form id="p-invite-form" class="p-form-grid"><label class="p-field">邮箱<input name="email" type="email" required placeholder="colleague@example.com"></label><label class="p-field">角色<select name="role"><option value="member">协作成员</option><option value="viewer">只读成员</option><option value="admin">管理员</option></select></label><button class="p-btn p-primary" type="submit">创建演示邀请</button></form></section>`:'<div class="p-notice">仅团队管理员可以邀请成员或调整角色。</div>'}${state.invites.filter(i=>i.space===state.space).length?`<section class="p-section"><h3>待接受的邀请</h3>${state.invites.filter(i=>i.space===state.space).map(i=>`<div class="p-pending"><div><strong class="p-small">${esc(i.email)}</strong><p class="p-small p-muted">${roleNames[i.role]} · 待接受</p></div>${link('预览受邀人的加入流程','preview-invite',`data-id="${i.id}"`)}</div>`).join('')}</section>`:''}${canAdmin()?`<section class="p-section"><details><summary class="p-small p-muted">团队设置</summary><form id="p-team-name-form" class="p-section"><label class="p-field">团队名称<input name="teamName" required value="${esc(spaceName())}"></label><button class="p-btn" type="submit">保存名称</button></form></details></section>`:''}</main>`;}

    else form=`${inviteBlock}${state.resetDone?'<div class="p-notice">重置流程演示已完成，请体验登录。</div>':''}<form id="p-auth-form">${mode==='register'?'<label class="p-field">显示名称<input name="name" required autocomplete="off" placeholder="同事看到的名字"></label>':''}<label class="p-field">邮箱<input name="email" type="email" required autocomplete="off" ${invite?`value="${esc(invite.email)}" readonly`:'placeholder="yourname@example.com"'}></label><label class="p-field">密码<input name="password" type="password" required autocomplete="off" placeholder="仅输入演示密码，不要使用真实密码"></label><button class="p-btn p-primary p-wide" type="submit">${mode==='register'?invite?'注册并加入团队':'注册并进入个人空间':invite?'登录并加入团队':'登录'}</button></form><div class="p-auth-links">${link(mode==='register'?'已有账号？登录':'还没有账号？注册',mode==='register'?'login':'register')}${mode==='login'?link('忘记密码？','forgot'):''}</div><div class="p-section">${btn('使用演示账号体验','demo-login','p-wide')}</div>`;

  function render(){

  function selectSpace(id){

  function setScene(name){state.scene=name;state.invitation=null;state.logged=true;state.me='林工';state.email='lin@example.com';state.joinedSpaces=['team'];state.members.forEach(m=>m.self=m.email===state.email);state.role=name==='viewer'?'viewer':name==='member'?'member':'admin';state.showReason=false;selectSpace(name==='personal'?'personal':'team');state.role=name==='viewer'?'viewer':name==='member'?'member':'admin';if(name==='login'){state.logged=false;state.view='auth';state.auth='login';}if(name==='invite'){state.logged=false;state.view='auth';state.auth='invite';state.invitation={id:99,space:'team',teamName:state.teamName,email:'guest@example.com',role:'member'};}if(['busy','question'].includes(name)){const c=current();if(c){c.running={author:'小王',round:c.running?.round||nextRound(c),time:stamp(),waiting:name==='question'};c.question=name==='question'?'请确认：不转的是座舱送风风机，还是其他空调部件？':null;}}clearFeedback();render();}
  function finishRun(){const c=current();if(!c?.running)return;const r=c.running;c.round=r.round;c.runs.push({round:r.round,author:r.author,time:stamp(),status:'有限结果（演示）',reason:'PROTOTYPE_ONLY'});c.status='limited';c.summary='本轮演示已结束，提交的信息已记录。原型没有调用真实模型，尚未形成新的可靠诊断；可以查看记录并继续补充。';c.updated=stamp();c.running=null;render();tell('本轮演示已结束。先查看当前结果，再决定是否提交你准备的草稿；没有自动发起下一轮。');persist();}
  function acceptInvite(){
    const i=state.invitation;if(!i)return;
    state.logged=true;state.email=i.email;state.space=i.space;state.role=i.role;
    if(!state.joinedSpaces.includes(i.space))state.joinedSpaces.push(i.space);
    const group=members();let person=group.find(m=>m.email===i.email);
    if(!person){person={id:nextId++,name:'受邀同事',email:i.email,role:i.role};group.push(person);}
    state.me=person.name;group.forEach(m=>m.self=m.id===person.id);

  function addAttachment(title,content){const c=current();if(!c||!canEdit())return;c.attachments.push({id:nextId++,title,content,author:state.me,time:stamp(),nature:'用户提供 · 未现场核实',published:false});state.drawer='attachments';render();tell('已在原型中添加调查附件，仅当前调查可用；未发送到服务器。');}
  root.addEventListener('click',e=>{
    const submitter=e.target.closest('button[type="submit"]');
    if(submitter&&!submitter.disabled){e.preventDefault();submitter.closest('form')?.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}

    else if(a==='invite-login'){state.auth='login';}
    else if(a==='invite-register'){state.auth='register';}
    else if(a==='accept-invite'){acceptInvite();persist();return;}
    else if(a==='create-team'){state.view='create-team';state.drawer=null;}
    else if(a==='nav'){state.view=el.dataset.view;state.drawer=null;if(state.view==='case'&&!current()){state.caseId=scopeCases()[0]?.id||null;}state.tab='overview';}
    else if(a==='new'){if(!canEdit())return;state.view='new';state.drawer=null;}
    else if(a==='back-case'){state.view='case';}
    else if(a==='open-case'){state.caseId=el.dataset.id;state.view='case';state.tab='overview';state.drawer=null;}
    else if(a==='related-case'){state.caseId=scopeCases().find(x=>x.asset==='EV-DEMO-016')?.id||null;state.view=current()?'case':'new';}
    else if(a==='tab'){state.tab=el.dataset.tab;state.showReason=false;}
    else if(a==='reason'){state.tab='process';state.showReason=true;}
    else if(a==='cancel-run'){if(!c?.running||!canEdit()||(!canAdmin()&&c.running.author!==state.me))return;state.drawer='cancel';}
    else if(a==='confirm-cancel'){if(!c?.running||!canEdit()||(!canAdmin()&&c.running.author!==state.me))return;c.runs.push({round:c.running.round,author:c.running.author,time:stamp(),status:'已取消（演示）',reason:'CANCELLED_BY_USER'});c.running=null;c.question=null;state.drawer=null;render();tell('本轮已取消，既有结果和提交记录保留。草稿没有自动提交。');persist();return;}
    else if(['sources','attachments','asset','report'].includes(a)){state.drawer=state.drawer===a?null:a;}
    else if(a==='close-drawer'){state.drawer=null;}
    else if(a==='read-attachment'){state.attachmentId=Number(el.dataset.id);state.drawer='read-attachment';}
    else if(a==='publish'){if(!canEdit())return;state.attachmentId=Number(el.dataset.id);state.drawer='publish';}
    else if(a==='sample-attachment'){addAttachment('现场补充记录.md','【演示附件】记录设备现象、检查条件与待核实内容。未提供现场实测结果。');persist();return;}
    else if(a==='quote'){if(!canEdit()||!c)return;const d=c.discussion.find(d=>d.id===Number(el.dataset.id));if(d)state.quotes[draftKey()]={...d};state.tab='overview';state.drawer=null;}

    else if(a==='preview-invite'){const i=state.invites.find(i=>i.id===Number(el.dataset.id));if(i){state.invitation=i;state.view='auth';state.auth='invite';state.logged=false;}}

  root.addEventListener('change',async e=>{
    if(e.target.id==='p-scene'){setScene(e.target.value);persist();return;}
    if(e.target.id==='p-space'){selectSpace(e.target.value);state.scene=e.target.value==='personal'?'personal':state.role==='viewer'?'viewer':state.role==='member'?'member':'team';clearFeedback();render();persist();return;}
    if(e.target.dataset.memberRole){if(!canAdmin())return;const m=members().find(m=>m.id===Number(e.target.dataset.memberRole));if(m&&!m.self){m.role=e.target.value;tell(`已在原型中将${m.name}设为${roleNames[m.role]}。`);}return;}
    if(e.target.id==='p-file'){if(!canEdit())return;const f=e.target.files?.[0];if(!f)return;if(!/\.(md|txt)$/i.test(f.name)){tell('原型支持 MD / TXT 资料，请选择对应格式。');return;}const text=await f.text();addAttachment(f.name,text);persist();}
  });
  root.addEventListener('submit',e=>{
    e.preventDefault();const form=e.target;if(!form.reportValidity())return;const data=new FormData(form),c=current();clearFeedback();
    if(form.id==='p-auth-form'){
      state.email=String(data.get('email'));state.logged=true;
      const account=accounts[state.email];
      state.me=String(data.get('name')||account?.name||'演示用户');
      state.joinedSpaces=account?[...account.joinedSpaces]:[];
      accounts[state.email]={name:state.me,joinedSpaces:[...state.joinedSpaces]};
      form.reset();if(state.invitation){acceptInvite();persist();return;}selectSpace('personal');state.view=state.auth==='register'?'new':'case';state.scene='personal';render();tell('已进入原型的个人空间。账号未经过真实验证，密码未保存。');persist();return;
    }
    if(form.id==='p-forgot-form'){state.forgotSent=true;form.reset();render();persist();return;}
    if(form.id==='p-reset-form'){if(data.get('password')!==data.get('confirm')){root.querySelector('#p-reset-error').hidden=false;return;}form.reset();state.auth='login';state.resetDone=true;render();persist();return;}
    if(form.id==='p-create-team-form'){const name=String(data.get('name')).trim();if(!name)return;const team={id:'team-'+nextId++,name};state.customTeams.push(team);state.joinedSpaces.push(team.id);accounts[state.email]={name:state.me,joinedSpaces:[...state.joinedSpaces]};libraries[team.id]=[];team.members=[{id:nextId++,name:state.me,email:state.email,role:'admin',self:true}];selectSpace(team.id);state.view='members';render();tell('团队已在原型中创建。现在可以邀请同事，或在新空间创建调查。');persist();return;}
    if(form.id==='p-team-name-form'){if(!canAdmin())return;const name=String(data.get('teamName')).trim();if(!name)return;if(state.space==='team')state.teamName=name;else state.customTeams.find(t=>t.id===state.space).name=name;render();tell('团队名称已在原型中更新。');return;}
    if(form.id==='p-invite-form'){if(!canAdmin())return;state.invites.push({id:nextId++,space:state.space,teamName:spaceName(),email:String(data.get('email')),role:String(data.get('role'))});render();tell('演示邀请已生成。可预览受邀人的加入流程；本原型没有发送邮件。');persist();return;}
    if(form.id==='p-new-form'){if(!canEdit())return;const title=String(data.get('title')).trim(),symptom=String(data.get('symptom')).trim();if(!title||!symptom)return;const nc={id:'case-'+nextId++,space:state.space,owner:state.email,title,asset:String(data.get('asset')),round:0,status:'draft',summary:'正在整理本次提交的信息。原型不连接模型，完成演示后可继续补充。',updated:stamp(),creator:state.me,running:{author:state.me,round:1,time:stamp()},sourceCount:0,discussion:[],notes:[{author:state.me,time:stamp(),text:symptom,round:1}],runs:[],attachments:[]};cases.push(nc);state.caseId=nc.id;state.view='case';state.tab='overview';render();tell('已开始新调查的运行演示。可在顶部点击“结束本轮演示”查看接续状态。');persist();return;}
    if(form.id==='p-analysis-form'){if(!canEdit()||!c||isBlocked(c))return;const key=draftKey(),text=String(data.get('information')||'').trim(),quote=state.quotes[key],round=c.running?.waiting?c.running.round:nextRound(c);if(!text&&!quote)return;c.notes.push({author:state.me,time:stamp(),text:text||'请结合引用的讨论继续调查。',quote:quote?{...quote}:null,round:round});c.running={author:state.me,round:round,time:stamp()};c.question=null;state.drafts[key]='';delete state.quotes[key];render();tell('已进入运行演示。后续草稿不会加入正在运行的这一轮；可继续讨论或等待本轮结束。');persist();return;}
    if(form.id==='p-discussion-form'){if(!canEdit()||!c)return;const text=String(data.get('discussion')).trim();if(!text)return;c.discussion.push({id:nextId++,author:state.me,time:stamp(),text});state.discussionDrafts[c.id]='';render();tell('讨论已发表，没有发起分析，也没有自动加入分析上下文。');persist();return;}
    if(form.id==='p-publish-form'){if(!canEdit()||!c)return;const a=c.attachments.find(a=>a.id===state.attachmentId);if(!a||a.published)return;const title=String(data.get('title')).trim(),scope=String(data.get('applicability')).trim();if(!title||!scope)return;library().push({id:nextId++,title,scope,author:state.me,originalAuthor:a.author,content:a.content,nature:a.nature});a.published=true;state.drawer='attachments';render();tell(`已明确加入${spaceName()}知识库，保留原始附件及来源性质。原型不执行真实向量化。`);persist();return;}
  });
  root.addEventListener('keydown',e=>{if(!e.target.matches('[role="tab"]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...root.querySelectorAll('[role="tab"]')],index=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;const tab=tabs[next].dataset.tab;state.tab=tab;render();root.querySelector(`[data-tab="${tab}"]`)?.focus();persist();});
  root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.form){e.preventDefault();const button=e.target.form.querySelector('button[type="submit"]');if(button&&!button.disabled)e.target.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
  finishButton.addEventListener('click',finishRun);
  const saved=window.openai?.widgetState?.privateContent;
  function restore(ui){if(ui?.version!==2)return;const scenes=['team','member','viewer','busy','question','personal','login','invite'];if(!scenes.includes(ui.scene))return;if(JSON.stringify(ui)===JSON.stringify(uiSnapshot()))return;setScene(ui.scene);if(['personal','team'].includes(ui.space)&&state.logged)selectSpace(ui.space);if(['case','new','knowledge','devices','members'].includes(ui.view)&&state.logged)state.view=ui.view;if(['overview','discussion','records','process'].includes(ui.tab))state.tab=ui.tab;if(['login','register','forgot','reset','invite'].includes(ui.auth))state.auth=ui.auth;if(ui.logged===false){state.logged=false;state.view='auth';}render();}
  restore(saved);render();
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.privateContent));
})();
</script>
