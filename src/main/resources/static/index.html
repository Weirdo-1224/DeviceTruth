<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeviceTruth 演示台（模拟数据）</title>
<style>
  :root { --bg:#f4f5f7; --card:#ffffff; --line:#e2e5ea; --text:#22262b; --muted:#7a828d;
          --accent:#2f6fed; --ok:#1a9e54; --warn:#c77700; --bad:#d43a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--card);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#eef2fb; color:var(--accent); }
  .spacer { flex:1; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card);
           border-radius:6px; padding:6px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #health { font-size:12px; color:var(--muted); }
  #health.up { color:var(--ok); }
  #health.down { color:var(--bad); }
  main { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:860px; margin:0 auto 12px; display:flex; gap:10px; }
  .msg .bubble { background:var(--card); border:1px solid var(--line); border-radius:10px;
                 padding:10px 14px; width:100%; }
  .msg.user { flex-direction:row-reverse; }
  .msg.user .bubble { background:#eaf1fe; border-color:#cfe0fb; }
  .meta { font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; gap:8px; flex-wrap:wrap; }
  .route { font-weight:600; color:var(--accent); }
  .route.DIAGNOSE { color:var(--warn); }
  .content { white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.6; }
  details { margin-top:8px; font-size:13px; }
  summary { cursor:pointer; color:var(--muted); }
  .kv { margin:6px 0 0; }
  .kv dt { color:var(--muted); font-size:12px; margin-top:6px; }
  .kv dd { margin:2px 0 0 0; white-space:pre-wrap; word-break:break-all; }
  .outcome { display:inline-block; font-weight:700; padding:1px 8px; border-radius:8px; font-size:12px; }
  .outcome.RESOLVED { background:#e5f6ec; color:var(--ok); }
  .outcome.NEED_EVIDENCE, .outcome.CONFLICT, .outcome.ESCALATE { background:#fdf1e2; color:var(--warn); }
  .FAILED { background:#fceaea; color:var(--bad); }
  .events li { font-size:12px; color:var(--muted); font-family:Consolas,monospace; margin:2px 0; }
  footer { padding:12px 16px; background:var(--card); border-top:1px solid var(--line); }
  .composer { max-width:860px; margin:0 auto; display:flex; gap:8px; }
  .composer input { flex:1; font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:6px; }
  .composer input#assetHint { flex:0 0 140px; }
  #sessionLine { max-width:860px; margin:0 auto 6px; font-size:11px; color:var(--muted);
                 font-family:Consolas,monospace; word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>DeviceTruth 演示台</h1>
  <span class="badge">模拟数据</span>
  <span class="spacer"></span>
  <span id="health">检查中…</span>
  <button id="newSession">新建会话</button>
</header>
<main id="log"></main>
<footer>
  <div id="sessionLine"></div>
  <div class="composer">
    <input id="assetHint" placeholder="设备编号（可选）">
    <input id="input" placeholder="例如：查询 CAR-B 的出厂档案 / CAR-B 通信超时，帮我诊断">
    <button class="primary" id="send">发送</button>
  </div>
</footer>
<script>
// 最小演示前端：直连 ConversationController 的 JSON API，无构建、无依赖。
const $ = s => document.querySelector(s);
const log = $('#log');
let sessionId = null;

// 机器码 → 中文标签：页面只展示中文，原始码放进 title 供追溯
const LABELS = {
  route: { QUERY: '查询', DIAGNOSE: '诊断', CLARIFY: '澄清', UNSUPPORTED: '不支持' },
  outcome: { RESOLVED: '已结案', NEED_EVIDENCE: '证据不足', CONFLICT: '证据冲突', ESCALATE: '需人工接管', FAILED: '执行失败' },
  status: { QUEUED: '排队中', RUNNING: '执行中', COMPLETED: '已完成', FAILED: '失败' },
  needStatus: { OPEN: '待补充', BLOCKED: '已阻塞', SATISFIED: '已满足' },
  event: {
    REASON_INPUT: '推理输入', MODEL_ATTEMPT: '模型尝试', ACTION_PROPOSED: '动作提议',
    CAPABILITY_RESULT: '能力调用结果', HYPOTHESIS_INVALIDATED: '假设失效',
    RULE_SELECTION_INVALIDATED: '规则选择失效', GUARD_RESULT: '结案校验',
    GUARD_REVIEW: '证据需求复审', STATE_COMMITTED: '提交状态', TECHNICAL_FAILURE: '技术失败',
    TERMINATED: '运行结束'
  },
  stopReason: {
    RULE_AND_EVIDENCE_VERIFIED: '规则与证据校验通过',
    MISSING_REQUIRED_EVIDENCE: '缺少必需证据',
    RULE_REQUIRES_HUMAN_REVIEW: '规则要求人工复核',
    CURRENT_EVIDENCE_CONFLICT: '当前证据存在冲突',
    EXECUTION_BUDGET_EXHAUSTED: '执行预算耗尽',
    REPEATED_ACTION_WITHOUT_NEW_INFORMATION: '重复动作且无新信息',
    TOOL_FAILURE_NO_PROGRESS: '工具失败且无进展',
    REASONER_FAILURE: '推理器失败',
    MODEL_TRANSPORT_OR_TIMEOUT: '模型通信失败或超时',
    MODEL_OUTPUT_INVALID_AFTER_RETRY: '模型输出重试后仍不合法',
    MODEL_CONFIGURATION_UNREADABLE: '模型配置不可读',
    OPENAI_CONFIGURATION_INVALID: '模型连接配置不合法',
    OPENAI_API_KEY_MISSING: '缺少 OPENAI_API_KEY',
    OPENAI_BASE_URL_MISSING: '缺少 OPENAI_BASE_URL',
    OPENAI_MODEL_MISSING: '缺少 OPENAI_MODEL',
    DASHSCOPE_API_KEY_MISSING: '缺少 DASHSCOPE_API_KEY',
    STOP_REASON_WITHHELD: '停止原因已隐藏',
    RUN_FAILED_WITHHELD_REASON: '失败原因已隐藏'
  },
  action: {
    CALL_CAPABILITY: '调用能力', PROPOSE_HYPOTHESIS: '提出假设', PROPOSE_DECISION: '请求下结论',
    REQUEST_INFORMATION: '请求补充信息', ESCALATE: '请求人工接管', UNKNOWN: '未知动作'
  },
  attempt: {
    VALID_PROPOSAL: '输出合法', INVALID_JSON_OR_SCHEMA: '输出不合法',
    MODEL_TRANSPORT_OR_TIMEOUT: '模型通信失败或超时'
  }
};
const zh = (dict, code, fallback) => (dict && code && dict[code]) || fallback || code || '';

// 摘要文本里内嵌的机器码（如 结案校验：RULE_AND_EVIDENCE_VERIFIED）统一替换成中文标签
const CODE_LABELS = Object.assign({}, LABELS.outcome, LABELS.stopReason, LABELS.status, LABELS.route,
  LABELS.action, LABELS.attempt);
const CODE_RE = new RegExp('\\b(' + Object.keys(CODE_LABELS).sort((a, b) => b.length - a.length).join('|') + ')\\b', 'g');
function localizeCodes(text) {
  return text ? text.replace(CODE_RE, m => CODE_LABELS[m] || m) : text;
}

const esc = s => String(s ?? ''); // 一律用 textContent 写入，不做 HTML 拼接

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function scrollBottom() { log.scrollTop = log.scrollHeight; }

function addMessage(role, route, text) {
  const wrap = el('div', 'msg ' + role);
  const bubble = el('div', 'bubble');
  const meta = el('div', 'meta');
  if (route) {
    const badge = el('span', 'route ' + route, zh(LABELS.route, route));
    badge.title = route;
    meta.append(badge);
  }
  meta.append(el('span', null, new Date().toLocaleTimeString()));
  bubble.append(meta, el('div', 'content', text));
  wrap.append(bubble);
  log.append(wrap);
  scrollBottom();
  return bubble;
}

function addDetails(bubble, title) {
  const d = document.createElement('details');
  d.append(el('summary', null, title));
  bubble.append(d);
  return d;
}

function addKV(parent, key, value) {
  if (value === null || value === undefined || value === '') return;
  const dl = parent.tagName === 'DL' ? parent : (parent.querySelector('dl') || parent.appendChild(el('dl', 'kv')));
  dl.append(el('dt', null, key), el('dd', null, typeof value === 'string' ? value : JSON.stringify(value, null, 2)));
}

async function api(path, options) {
  const resp = await fetch(path, options ? { headers: { 'Content-Type': 'application/json' }, ...options } : undefined);
  const body = await resp.json().catch(() => null);
  if (!resp.ok) throw Object.assign(new Error(body?.message || ('HTTP ' + resp.status)), { body });
  return body;
}

async function checkHealth() {
  try {
    const h = await api('/api/health');
    const node = $('#health');
    node.textContent = h.status === 'UP' ? '服务正常' : '服务异常';
    node.className = h.status === 'UP' ? 'up' : 'down';
  } catch {
    const node = $('#health');
    node.textContent = '服务不可达';
    node.className = 'down';
  }
}

async function createSession() {
  const s = await api('/api/sessions', { method: 'POST' });
  sessionId = s.sessionId;
  log.innerHTML = '';
  $('#sessionLine').textContent = '会话：' + sessionId;
  addMessage('system', null, '会话已创建。可以试试：“查询 CAR-B 的出厂档案”或“CAR-B 通信超时，帮我诊断”。');
}

// QUERY：直接展示回答、来源与语义边界
function renderQuery(bubble, q) {
  const d = addDetails(bubble, '查询明细（来源 / 边界声明）');
  const dl = el('dl', 'kv');
  addKV(dl, '回答', q.answer);
  (q.sources || []).forEach(s => addKV(dl, '来源 ' + s.evidenceId, s.sourceType + ' · ' + s.sourceRef));
  (q.limitations || []).forEach((l, i) => addKV(dl, '边界 ' + (i + 1), l));
  d.append(dl);
}

// DIAGNOSE：轮询运行状态直到结束，再展示结论与脱敏事件流
async function renderDiagnosis(bubble, diagnosisId) {
  const status = el('div', 'content', '诊断执行中，正在轮询状态…');
  bubble.append(status);
  const d = addDetails(bubble, '运行轨迹（结束后可见）');
  let snap;
  for (;;) {
    await new Promise(r => setTimeout(r, 800));
    snap = await api('/api/diagnoses/' + diagnosisId + '?sessionId=' + sessionId);
    status.textContent = '执行状态：' + zh(LABELS.status, snap.executionStatus);
    if (snap.executionStatus === 'COMPLETED' || snap.executionStatus === 'FAILED') break;
  }
  bubble.removeChild(status);
  if (!snap.outcome) {
    addMessage('system', 'DIAGNOSE', '诊断失败：' + zh(LABELS.stopReason, snap.errorCode, '未知错误'));
    return;
  }
  const head = el('div', 'content');
  const badge = el('span', 'outcome ' + snap.outcome, zh(LABELS.outcome, snap.outcome));
  badge.title = snap.outcome;
  const reason = el('span', null, '  步数 ' + snap.stepsUsed + ' · ' + zh(LABELS.stopReason, snap.stopReason));
  reason.title = snap.stopReason || '';
  head.append(badge, reason);
  bubble.append(head);
  const dl = el('dl', 'kv');
  addKV(dl, '结论', snap.diagnosisSummary);
  addKV(dl, '应用规则', (snap.appliedRuleIds || []).join(', '));
  addKV(dl, '支撑证据', (snap.supportingEvidenceIds || []).join(', '));
  addKV(dl, '未满足需求', (snap.openNeeds || [])
    .map(n => n.needId + '（' + zh(LABELS.needStatus, n.status) + '）').join('；'));
  bubble.append(dl);
  if (snap.executionStatus === 'COMPLETED') {
    const ev = await api('/api/diagnoses/' + diagnosisId + '/events?sessionId=' + sessionId);
    const ul = el('ul', 'events');
    (ev.events || []).forEach(e => {
      const label = zh(LABELS.event, e.type, '事件');
      const summary = localizeCodes(e.summary);
      const li = el('li', null, '#' + e.sequence + ' ' + label + ' v' + e.stateVersion +
        (summary ? ' ' + summary : ''));
      li.title = e.type;
      ul.append(li);
    });
    d.append(ul);
  }
}

async function send() {
  const input = $('#input');
  const content = input.value.trim();
  if (!content || !sessionId) return;
  input.value = '';
  addMessage('user', null, content);
  const assetId = $('#assetHint').value.trim();
  const btn = $('#send');
  btn.disabled = true;
  try {
    const r = await api('/api/sessions/' + sessionId + '/messages', {
      method: 'POST',
      body: JSON.stringify(assetId ? { content, assetId } : { content })
    });
    const bubble = addMessage('system', r.route, r.reply);
    if (r.route === 'QUERY' && r.query) renderQuery(bubble, r.query);
    if (r.route === 'DIAGNOSE' && r.diagnosisId) renderDiagnosis(bubble, r.diagnosisId).catch(e => addMessage('system', null, '轮询失败：' + e.message));
  } catch (e) {
    addMessage('system', null, '请求失败：' + e.message);
  } finally {
    btn.disabled = false;
  }
}

$('#send').addEventListener('click', send);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#newSession').addEventListener('click', () => createSession().catch(e => addMessage('system', null, '建会话失败：' + e.message)));

checkHealth();
setInterval(checkHealth, 10000);
createSession().catch(e => addMessage('system', null, '初始化失败：' + e.message));
</script>
</body>
</html>
