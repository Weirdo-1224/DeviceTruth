# 本地固定服务器身份；共享部署前必须接入真实认证（05-03）。
devicetruth.product.owner-id=${DEVICETRUTH_OWNER_ID:local-owner}
devicetruth.product.project-id=${DEVICETRUTH_PROJECT_ID:local-project}
spring.sql.init.mode=never
logging.level.org.springframework.jdbc=INFO
logging.level.com.zaxxer.hikari=WARN

# 知识导入/检索：embedding 从本地私有模型配置或服务端环境注入，不进入浏览器、Skill、附件或报告。
# 默认供应商为千问 text-embedding-v4（DashScope compatible-mode，1024 维 cosine）；
# 专用 DEVICETRUTH_EMBEDDING_API_KEY 为空时复用 DASHSCOPE_API_KEY。
# 档案标识由 provider:model@dimension-cosine-r<revision> 推导，任何一项变化都必须独立重建索引；
# deterministic 供应商固定使用自己的模型名，不能与真实供应商共用档案。
devicetruth.embedding.provider=${DEVICETRUTH_EMBEDDING_PROVIDER:openai}
devicetruth.embedding.base-url=${DEVICETRUTH_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
devicetruth.embedding.api-key=${DEVICETRUTH_EMBEDDING_API_KEY:}
devicetruth.embedding.model=${DEVICETRUTH_EMBEDDING_MODEL:text-embedding-v4}
devicetruth.embedding.dimension=${DEVICETRUTH_EMBEDDING_DIMENSION:1024}
devicetruth.embedding.profile-revision=${DEVICETRUTH_EMBEDDING_PROFILE_REVISION:1}
devicetruth.embedding.timeout-ms=${DEVICETRUTH_EMBEDDING_TIMEOUT_MS:15000}
devicetruth.embedding.send-dimensions=${DEVICETRUTH_EMBEDDING_SEND_DIMENSIONS:true}
devicetruth.knowledge.max-chunks=${DEVICETRUTH_KNOWLEDGE_MAX_CHUNKS:5}
devicetruth.knowledge.min-similarity=${DEVICETRUTH_KNOWLEDGE_MIN_SIMILARITY:0.45}
devicetruth.knowledge.max-chunk-chars=${DEVICETRUTH_KNOWLEDGE_MAX_CHUNK_CHARS:480}
devicetruth.files.root=${DEVICETRUTH_FILES_ROOT:outputs/files}
devicetruth.files.max-concurrent-imports=${DEVICETRUTH_FILES_MAX_CONCURRENT_IMPORTS:1}
devicetruth.files.max-queue=${DEVICETRUTH_FILES_MAX_QUEUE:4}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# 通用 Agent：每 run 新建推理器实例，worker 有界；队列满时直接 FAILED/QUEUE_REJECTED，
# 不留下永远 QUEUED 的幽灵任务。worker-enabled=false 只保留 M0 的 QUEUED 持久化合同。
# 缺省留空：显式配置（命令行/测试注入）优先，其次环境变量，最后本地私有模型文件。
devicetruth.agent.reasoner=${DEVICETRUTH_AGENT_REASONER:}
devicetruth.agent.worker-enabled=${DEVICETRUTH_AGENT_WORKER_ENABLED:true}
devicetruth.agent.max-concurrent-runs=${DEVICETRUTH_AGENT_MAX_CONCURRENT_RUNS:2}
devicetruth.agent.max-queue=${DEVICETRUTH_AGENT_MAX_QUEUE:10}
# 跨进程检查点（03-02）：worker 领取 RUNNING 时持执行租约并周期性续租；
# 服务重启后只回收“租约已过期”的遗留 RUNNING，未过期的仍归活进程，WAITING_FOR_USER 原样保留。
# 同一 run 的恢复重调度以 max-recovery-attempts 为界，超限明确 FAILED，禁止永久 RUNNING。
devicetruth.agent.lease-seconds=${DEVICETRUTH_AGENT_LEASE_SECONDS:60}
devicetruth.agent.max-recovery-attempts=${DEVICETRUTH_AGENT_MAX_RECOVERY_ATTEMPTS:3}
# 总时限与用量（03-03）：总时限=累计执行时长上限（毫秒，不含等待用户的时间），写入每个 run 的
# budget.limits.maxActiveDurationMs，恢复/重调度不清零，超限明确 FAILED/TOTAL_TIMEOUT；
# 取消经 POST /api/runs/{id}/cancel，终态后迟到的模型响应只记 RUN_LATE_RESPONSE 事件不提交；
# 供应商未返回 usage 时 Token/成本记 null、usageStatus=UNKNOWN，绝不编造数值。
devicetruth.agent.max-active-duration-ms=${DEVICETRUTH_AGENT_MAX_ACTIVE_DURATION_MS:120000}
