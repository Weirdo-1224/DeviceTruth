<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeviceTruth · V2 视觉原型</title><style>
:root{font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#20283b;background:#f7f8fb;--line:#e7eaf0;--muted:#788397;--ink:#1c2639;--primary:#5863d8;--soft:#f0f1ff}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #5863d8;outline-offset:3px}button{border:0;background:none;color:inherit}.app{height:100dvh;display:grid;grid-template-columns:224px minmax(0,1fr) 340px}.sidebar,.evidence{background:#fff;overflow:auto}.sidebar{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:16px;padding:0 8px 25px}.logo,.avatar{display:grid;place-items:center;background:#5863d8;color:white;border-radius:9px;width:30px;height:30px}.new{border:1px solid #dfe3ed;border-radius:8px;padding:10px;text-align:left;font-weight:600;background:#fff}.new:hover,.ghost:hover{background:#f5f6fb}.side-label{font-size:11px;color:#929bab;font-weight:700;letter-spacing:.08em;margin:27px 10px 9px}.item{padding:10px;border-radius:8px;color:#596578;font-size:13px}.item.active{background:#f0f1fb;color:#4e59c5;font-weight:650}.item small{display:block;font-size:11px;color:#9aa3b1;font-weight:400;margin-top:4px}.sidefoot{margin-top:auto;padding:15px 10px;color:#949dad;font-size:11px}.main{min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#fff}.header{height:68px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.headleft{display:flex;gap:12px;align-items:center;min-width:0}.headtitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headsub{font-size:11px;color:#929bab}.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f3f7;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:650;color:#687487;white-space:nowrap}.chip.running{color:#875f1d;background:#fff5df}.chip.complete{color:#28775b;background:#eaf7f0}.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}.ghost{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12px;color:#617087}.mobile-menu{display:none}.scroll{overflow:auto;flex:1;padding:32px 40px}.inner{max-width:760px;margin:auto}.eyebrow{font-size:11px;font-weight:700;color:#8791a3;letter-spacing:.07em}.taskhead{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:26px}.taskhead h1{font-size:23px;line-height:1.3;letter-spacing:-.5px;margin:6px 0;color:var(--ink)}.sub{color:#8b95a5;font-size:12px}.message{display:flex;gap:12px;margin:23px 0}.avatar{width:32px;height:32px;flex:none;font-size:13px;font-weight:700;background:#ebedff;color:#5763c9}.avatar.user{background:#edf0f4;color:#657185}.msgbody{flex:1;min-width:0}.meta{font-weight:700;font-size:13px}.meta time{font-size:11px;color:#a1aab8;font-weight:400;margin-left:7px}.bubble{background:#f5f6fa;border-radius:3px 12px 12px 12px;padding:12px 15px;margin-top:8px;color:#3a4658}.lead{color:#4b5669;margin:8px 0 16px}.timeline{border:1px solid #e7e9f0;border-radius:10px;overflow:hidden;margin:16px 0;background:#fff}.timeline-head{padding:13px 16px;background:#fafbfc;display:flex;justify-content:space-between;gap:8px;align-items:center}.timeline-head strong{font-size:13px}.timeline-head span{color:#909aaa;font-size:11px}.steps{padding:4px 16px 10px}.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;position:relative;padding:12px 0}.step:not(:last-child):before{content:"";position:absolute;left:10px;top:31px;bottom:-8px;width:1px;background:#dfe5eb}.node{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#e8f6ef;color:#32946c;font-size:11px;z-index:1}.node.current{background:#eef0ff;color:#5964d8}.step-title{font-weight:650;font-size:12px}.step-detail{font-size:11px;color:#909aaa;margin-top:2px}.step-right{font-size:11px;color:#8d97a6}.discovery{display:inline-block;background:#f3f5fb;border-radius:5px;padding:3px 7px;margin-top:6px;color:#677389;font-size:11px}.report{border:1px solid #e3e6ee;border-radius:11px;overflow:hidden;margin:16px 0}.report-top{padding:17px 18px;background:#fafbff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.report-top strong{font-size:14px}.report-content{padding:3px 18px 18px}.report-row{padding:13px 0;border-bottom:1px solid #f0f2f5;display:grid;grid-template-columns:92px 1fr;gap:12px}.report-row:last-child{border:0}.label{font-size:11px;color:#798497;font-weight:700}.report-row p{margin:0;color:#485468;font-size:13px}.ref{color:#5260ca;background:#eff0ff;border-radius:4px;padding:2px 6px;font-size:11px}.warn{background:#fff8eb;border-left:3px solid #e2ad48;padding:10px 12px;color:#896222;font-size:12px;border-radius:3px}.composer-wrap{padding:12px 40px 20px;border-top:1px solid #f1f2f5}.composer{max-width:760px;margin:auto;border:1px solid #dfe3ec;border-radius:11px;padding:12px;box-shadow:0 5px 20px #2330540a}.composer textarea{width:100%;border:0;outline:none;resize:none;height:42px;color:#344155}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.upload{color:#7b8797;font-size:12px}.send{background:#5964d9;color:white;border-radius:7px;padding:7px 13px;font-weight:600}.send:hover{background:#4652c4}.fine{max-width:760px;margin:7px auto 0;text-align:center;color:#a1aab7;font-size:10px}.evidence{border-left:1px solid var(--line);padding:22px 20px}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-head strong{font-size:14px}.panel-head p{font-size:11px;color:#99a2b0;margin:4px 0}.panel-section{border-top:1px solid #eef0f4;padding:20px 0}.panel-section h2{font-size:12px;color:#576478;margin:0 0 12px}.asset{font-weight:700}.asset-note{font-size:11px;color:#8e98a8;margin:4px 0 12px}.conflict{background:#fff8ec;border:1px solid #f4e4c6;color:#956a2d;border-radius:8px;padding:10px;font-size:12px}.factline{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:10px}.factline span{color:#8b95a4}.source{padding:10px 0;border-bottom:1px solid #f0f2f5;font-size:12px}.source strong{display:block}.source small{color:#929baa}.source details{color:#697688;margin-top:7px}.source summary{cursor:pointer}.close{font-size:18px;color:#8994a5}.empty{text-align:center;padding:90px 15px 50px}.empty-icon{width:48px;height:48px;border-radius:15px;background:#eef0ff;color:#5863d8;display:grid;place-items:center;font-size:22px;margin:0 auto 18px}.empty h1{font-size:22px;margin:0 0 8px}.empty p{color:#8993a4;margin:0 auto;max-width:360px}.examples{display:flex;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap}.example{border:1px solid #e5e8f0;border-radius:8px;padding:9px 12px;color:#697587;font-size:12px}.switcher{position:fixed;bottom:8px;right:12px;border-radius:22px;padding:5px;background:#222c3e;color:#fff;display:flex;gap:2px;z-index:8;box-shadow:0 4px 14px #1f293733}.switcher span{font-size:11px;padding:6px 8px;color:#b9c2d1}.switcher button{color:#c4ccda;font-size:11px;padding:6px 9px;border-radius:16px}.switcher button.active{background:#fff;color:#303a50}.overlay{display:none}.panel-hidden .app{grid-template-columns:224px minmax(0,1fr)}.panel-hidden .evidence{display:none}@media(max-width:1100px){.app,.panel-hidden .app{grid-template-columns:200px minmax(0,1fr)}.evidence,.panel-hidden .evidence{display:none;position:fixed;z-index:7;right:0;top:0;bottom:0;width:min(360px,90vw);box-shadow:-12px 0 30px #18253c22}.evidence.open,.panel-hidden .evidence.open{display:block}.overlay.open{display:block;position:fixed;inset:0;background:#19233866;z-index:6}}@media(max-width:680px){.app,.panel-hidden .app{display:flex}.main{width:100%}.sidebar{display:none;position:fixed;inset:0 auto 0 0;width:260px;z-index:7;box-shadow:10px 0 30px #17233d22}.sidebar.open{display:flex}.mobile-menu{display:inline-block}.header{padding:0 16px}.scroll{padding:24px 18px}.composer-wrap{padding:10px 18px 40px}.taskhead h1{font-size:20px}.report-row{grid-template-columns:1fr;gap:4px}.switcher{bottom:4px;right:4px}.empty{padding-top:60px}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="logo">◈</span>DeviceTruth <button class="close mobile-menu" data-close aria-label="关闭导航">×</button></div><button class="new" data-state="empty">＋　新调查</button><div class="side-label">工作区</div><div class="item active">◫　调查工作台</div><div class="side-label">最近会话</div><div class="item active">充电中断排查<small>模拟会话 · 今天</small></div><div class="item">冷却系统资料问答<small>模拟会话 · 昨天</small></div><div class="sidefoot">◉　演示工作区<br>原型数据不保存</div></aside><main class="main"><header class="header"><div class="headleft"><button class="ghost mobile-menu" id="menu" aria-label="打开导航">☰</button><div><div class="headsub">工作区 / 调查工作台</div><div class="headtitle" id="header-title"></div></div><span class="chip" id="header-status"></span></div><button class="ghost" id="open-evidence">☷ 依据</button></header><div class="scroll" id="scroll"><div class="inner" id="content"></div></div><div class="composer-wrap"><div class="composer"><textarea id="question" aria-label="输入问题" placeholder="描述设备现象，或继续追问…"></textarea><div class="actions"><div><button class="upload" id="attach">＋ 添加 Markdown 资料</button><input type="file" id="file" accept=".md,text/markdown" hidden><span class="headsub" id="file-status"></span></div><button class="send" id="send">发送 ↑</button></div></div><div class="fine">模拟原型 · 不连接服务 · 内容不构成诊断或操作指导</div></div></main><aside class="evidence" id="evidence" aria-label="调查依据"><div class="panel-head"><div><strong>调查依据</strong><p>来源、设备记录与核验边界</p></div><button class="close" data-close aria-label="关闭依据">×</button></div><div id="evidence-content"></div></aside></div><div class="overlay" id="overlay"></div><nav class="switcher" aria-label="原型状态切换"><span>模拟状态</span><button data-state="empty">空白</button><button data-state="running">进行中</button><button data-state="complete">已完成</button></nav><script>
const $=s=>document.querySelector(s);const evidenceData=`<div class="panel-section"><h2>关联设备</h2><div class="asset">EV-DEMO-021 <span class="chip">模拟资产</span></div><div class="asset-note">调查时点 2026-11-14 · 现场配置未确认</div><div class="conflict">⚠ 配置记录存在冲突<br>两条记录的部件型号不同，需现场核验。</div><div class="factline"><span>出厂记录</span><b>模块 A-17</b></div><div class="factline"><span>维修记录</span><b>模块 A-18</b></div></div><div class="panel-section"><h2>引用来源 <span class="headsub">2</span></h2><div class="source" id="source1"><strong>[1] 充电系统检修手册</strong><small>知识资料 · 第 3 章 · v1.0</small><details><summary>查看模拟摘录</summary>充电过程异常时，应先核对相关记录及报警信息。</details></div><div class="source" id="source2"><strong>[2] 设备维修记录</strong><small>资产记录 · 2025-08-12</small><details><summary>查看模拟摘录</summary>记录显示模块曾更换；现装型号仍需核验。</details></div></div><div class="panel-section"><h2>核验边界</h2><div class="asset-note">资料记载不等于现场事实；未核验前不得将可能原因视为确诊。</div></div>`;
function closePanels(){$('#sidebar').classList.remove('open');$('#evidence').classList.remove('open');$('#overlay').classList.remove('open')}
function showEvidence(){document.body.classList.remove('panel-hidden');if(innerWidth<=1100){$('#evidence').classList.add('open');$('#overlay').classList.add('open')}}
function render(state){const empty=state==='empty',running=state==='running';$('#header-title').textContent=empty?'新调查':'充电中断排查';$('#header-status').className='chip '+(empty?'':running?'running':'complete');$('#header-status').innerHTML='<i></i>'+(empty?'未开始':running?'调查中':'已完成');$('#evidence-content').innerHTML=empty?'<div class="panel-section"><p class="asset-note">开始调查后，来源与设备记录会显示在这里。</p></div>':evidenceData;document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===state));history.replaceState(null,'','?state='+state);$('#content').innerHTML=empty?`<div class="empty"><div class="empty-icon">✦</div><h1>开始一次新调查</h1><p>描述设备现象，Agent 会协助查找资料并整理可核验的线索。</p><div class="examples"><button class="example" data-example="设备充电中断，应该先查哪些资料？">充电中断，先查什么？</button><button class="example" data-example="设备配置记录不一致，如何核对？">核对设备配置记录</button></div></div>`:`<div class="taskhead"><div><div class="eyebrow">模拟调查 / EV-DEMO-021</div><h1>充电中断排查</h1><div class="sub">今天 10:24 · 设备关联可选 · 示例数据</div></div><span class="chip ${running?'running':'complete'}"><i></i>${running?'调查进行中':'调查已完成'}</span></div><div class="message"><div class="avatar user">我</div><div class="msgbody"><div class="meta">你 <time>10:24</time></div><div class="bubble">车辆充电过程中断，没有故障码。可以先查哪些资料？</div></div></div><div class="message"><div class="avatar">✦</div><div class="msgbody"><div class="meta">DeviceTruth Agent <time>${running?'正在调查':'10:25'}</time></div><p class="lead">${running?'我正在对照检修资料和设备记录，整理可核验的线索。':'我对照了检修资料和设备记录，以下是本次调查的模拟结果。'}</p><div class="timeline"><div class="timeline-head"><strong>调查过程</strong><span>${running?'2 / 3 步骤 · 模拟运行':'3 / 3 步骤 · 已完成'}</span></div><div class="steps"><div class="step"><div class="node">✓</div><div><div class="step-title">检索相关知识资料</div><div class="step-detail">search_knowledge · 1.2 秒</div><div class="discovery">发现 1 条相关资料 <button class="ref" data-ref="1">查看 [1]</button></div></div><div class="step-right">已完成</div></div><div class="step"><div class="node">✓</div><div><div class="step-title">对照设备配置记录</div><div class="step-detail">get_configuration · 0.4 秒</div><div class="discovery">发现记录冲突 <button class="ref" data-ref="2">查看 [2]</button></div></div><div class="step-right">已完成</div></div><div class="step"><div class="node ${running?'current':''}">${running?'·':'✓'}</div><div><div class="step-title">整理调查结论与核验事项</div><div class="step-detail">${running?'正在整理来源与不确定性':'来源与风险边界已整理'}</div></div><div class="step-right">${running?'进行中':'已完成'}</div></div></div></div>${running?'<p class="sub">调查仍在进行，最终报告尚未生成。</p>':`<div class="report"><div class="report-top"><strong>调查报告</strong><span class="chip complete">可能原因 · 非确诊</span></div><div class="report-content"><div class="report-row"><div class="label">资料支持</div><p>手册建议先核对充电过程记录与报警信息。 <button class="ref" data-ref="1">[1]</button></p></div><div class="report-row"><div class="label">可能原因</div><p>设备配置记录不一致；当前模块型号尚未确认。 <button class="ref" data-ref="2">[2]</button></p></div><div class="report-row"><div class="label">风险提示</div><div class="warn">涉及高风险操作时，请由具备资质的人员按厂家规程处理。</div></div><div class="report-row"><div class="label">人工核验</div><p>现场确认实际模块型号及报警记录；资料记载不代表现场事实。</p></div><div class="report-row"><div class="label">下一步建议</div><p>补充充电方式、发生时间及相关报警信息，继续缩小调查范围。</p></div></div></div><p class="lead">目前信息不足以确定故障原因。你可以继续补充现象或追问。</p>`}</div></div>`;closePanels()}
document.addEventListener('click',e=>{const state=e.target.closest('[data-state]');if(state)render(state.dataset.state);const ref=e.target.closest('[data-ref]');if(ref){showEvidence();let source=$('#source'+ref.dataset.ref);if(source){source.querySelector('details').open=true;source.scrollIntoView({block:'nearest'})}}const example=e.target.closest('[data-example]');if(example){$('#question').value=example.dataset.example;$('#question').focus()}});$('#open-evidence').onclick=()=>{if(innerWidth>1100)document.body.classList.toggle('panel-hidden');else showEvidence()};$('#menu').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('open')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(innerWidth>1100&&b.closest('.evidence'))document.body.classList.add('panel-hidden');closePanels()});$('#overlay').onclick=closePanels;document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});$('#attach').onclick=()=>$('#file').click();$('#file').onchange=e=>$('#file-status').textContent=e.target.files.length?' 已选择（未上传）：'+e.target.files[0].name:'';$('#send').onclick=()=>{let t=$('#question');if(!t.value.trim())return;let p=document.createElement('div');p.className='bubble';p.textContent='模拟输入（未发送）：'+t.value;$('#content').appendChild(p);t.value='';p.scrollIntoView({block:'nearest'})};let state=new URLSearchParams(location.search).get('state');render(['empty','running','complete'].includes(state)?state:'complete');
</script></body></html>
